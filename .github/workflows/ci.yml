name: CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      # No linter or test suite is configured for the backend yet.
      # This is a lightweight sanity check (syntax/import compile), not a test run.
      - run: python -m compileall backend -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # `npm run lint` has no ESLint config checked in yet, so it is not run here.
      # `build` runs `vue-tsc` first, which is the available type-check.
      - run: npm run build
